<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FTCMap — interactive world map of FIRST Tech Challenge teams.">
  <title>FTCMap — FIRST Tech Challenge Team Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- Full-screen map -->
  <div id="map" aria-label="World map of FTC teams"></div>

  <!-- Floating top bar -->
  <header class="topbar">
    <div class="brand" aria-label="FTCMap home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="6" fill="#00aaff"/>
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="#0b0e13" stroke-width="2.4"/>
        <circle cx="16" cy="16" r="1.6" fill="#0b0e13"/>
        <path d="M16 7.5v3M16 21.5v3M7.5 16h3M21.5 16h3" stroke="#0b0e13" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">FTC<span class="brand-accent">Map</span></span>
    </div>

    <div class="search" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-owns="search-results">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search teams…" autocomplete="off"
             autocapitalize="off" spellcheck="false" aria-label="Search teams by name or number"
             aria-autocomplete="list" aria-controls="search-results">
      <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>&times;</button>

      <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
      <div id="search-empty" class="search-empty" hidden>No teams found</div>
    </div>

    <div class="team-count" id="team-count" aria-live="polite"></div>
  </header>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- MarkerCluster -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="app.js"></script>
</body>
</html>
